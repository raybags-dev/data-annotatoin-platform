name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}/data-annotation-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}/data-annotation-frontend

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Syntax check
        working-directory: backend
        run: python -m py_compile app/main.py app/core/config.py app/core/database.py

  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PERSONAL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.167.74.127
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/data-annotation-platform
            cd /opt/data-annotation-platform
            # Pull latest compose file
            cat > docker-compose.prod.yml << 'COMPOSE_EOF'
            version: "3.9"
            services:
              ollama:
                image: ollama/ollama:latest
                restart: unless-stopped
                ports:
                  - "11434:11434"
                volumes:
                  - ollama_data:/root/.ollama
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}/data-annotation-backend:latest
                restart: unless-stopped
                ports:
                  - "8001:8001"
                env_file: .env
                environment:
                  - OLLAMA_URL=http://ollama:11434
                depends_on:
                  - ollama
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}/data-annotation-frontend:latest
                restart: unless-stopped
                ports:
                  - "5174:80"
                depends_on:
                  - backend
            volumes:
              ollama_data:
            COMPOSE_EOF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "Deploy complete — backend :8001, frontend :5174"
