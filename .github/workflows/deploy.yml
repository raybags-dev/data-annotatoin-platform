name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}/data-annotation-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}/data-annotation-frontend

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Syntax check
        working-directory: backend
        run: python -m py_compile app/main.py app/core/config.py app/core/database.py

  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PERSONAL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME_PERSONAL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        with:
          host: 89.167.74.127
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,APP_SECRET_KEY,DOCKERHUB_USER,KAGGLE_USERNAME,KAGGLE_KEY
          command_timeout: 30m
          script: |
            set -e
            mkdir -p /opt/data-annotation-platform
            cd /opt/data-annotation-platform

            # Write .env — only overwrite Supabase creds if the service key JWT
            # references the same project as SUPABASE_URL. This prevents a stale/wrong
            # GitHub secret from bricking a working deployment.
            _key_ref() { echo "$1" | cut -d. -f2 | { cat; echo; } | base64 -d 2>/dev/null | python3 -c "import sys,json; d=json.loads(sys.stdin.read().rstrip(chr(0))); print(d.get('ref',''))" 2>/dev/null; }
            _url_ref() { echo "$1" | sed 's|https://\([^.]*\)\..*|\1|'; }
            KEY_REF=$(_key_ref "$SUPABASE_SERVICE_KEY")
            URL_REF=$(_url_ref "$SUPABASE_URL")
            if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ] && [ -n "$APP_SECRET_KEY" ] \
               && [ -n "$KEY_REF" ] && [ "$KEY_REF" = "$URL_REF" ]; then
              printf 'APP_ENV=production\nSECRET_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\nSUPABASE_BUCKET=portfolio-base-bucket\nOLLAMA_URL=http://ollama:11434\nOLLAMA_MODEL=llama3.2:3b\nKAGGLE_USERNAME=%s\nKAGGLE_KEY=%s\n' \
                "$APP_SECRET_KEY" "$SUPABASE_URL" "$SUPABASE_SERVICE_KEY" "$KAGGLE_USERNAME" "$KAGGLE_KEY" > .env
              echo "INFO: .env written — key project ref '$KEY_REF' matches URL"
            else
              echo "WARNING: service key project ref '$KEY_REF' != URL ref '$URL_REF' or secrets missing — preserving existing .env"
              # Still patch Kaggle creds so they stay current
              for kv in "KAGGLE_USERNAME=$KAGGLE_USERNAME" "KAGGLE_KEY=$KAGGLE_KEY"; do
                key="${kv%%=*}"; val="${kv#*=}"
                [ -z "$val" ] && continue
                grep -q "^${key}=" .env 2>/dev/null \
                  && sed -i "s|^${key}=.*|${key}=${val}|" .env \
                  || echo "${key}=${val}" >> .env
              done
            fi

            # Write production compose (no version attribute — obsolete in Compose v2+)
            cat > docker-compose.prod.yml << COMPOSE_EOF
            services:
              ollama:
                image: ollama/ollama:latest
                restart: unless-stopped
                ports:
                  - "11434:11434"
                volumes:
                  - ollama_data:/root/.ollama

              backend:
                image: ${DOCKERHUB_USER}/data-annotation-backend:latest
                restart: unless-stopped
                ports:
                  - "8001:8001"
                env_file: .env
                environment:
                  - OLLAMA_URL=http://ollama:11434
                depends_on:
                  - ollama

              frontend:
                image: ${DOCKERHUB_USER}/data-annotation-frontend:latest
                restart: unless-stopped
                ports:
                  - "5174:80"
                depends_on:
                  - backend

            volumes:
              ollama_data:
            COMPOSE_EOF

            # Pull new images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Pull Ollama model inside the running container (detached — non-blocking)
            # Waits up to 15s for ollama to be ready then pulls in background
            (sleep 15 && docker compose -f docker-compose.prod.yml exec -T ollama ollama pull llama3.2:3b) &

            docker image prune -f
            echo "Deploy complete — backend :8001  frontend :5174"
