server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls when the SPA is served directly at port 5174 (dev / direct access).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    # API calls when the SPA is accessed via raybags.com/annotation/ (portfolio proxy).
    # baseURL='/annotation' in api.ts makes the browser call /annotation/api/...; the
    # portfolio nginx proxies the full path here, and we strip /annotation/ before
    # forwarding to the annotation backend.
    location /annotation/api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    # The SPA is built with base='/annotation/' so all asset URLs are prefixed
    # with /annotation/. This location uses alias to strip the prefix and serve
    # the actual dist files, then falls back to index.html for client-side routing.
    location /annotation/ {
        alias /usr/share/nginx/html/;
        try_files $uri /index.html;
    }

    # Redirect bare /annotation to /annotation/
    location = /annotation {
        return 301 /annotation/;
    }

    # Redirect root to /annotation/ (used when accessing via direct port 5174)
    location = / {
        return 301 /annotation/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
