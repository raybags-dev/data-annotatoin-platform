# Production compose — pulls images from Docker Hub.
# Run on VPS: docker compose -f docker-compose.prod.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1

  backend:
    image: ${DOCKERHUB_USERNAME}/data-annotation-backend:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  frontend:
    image: ${DOCKERHUB_USERNAME}/data-annotation-frontend:latest
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  ollama_data:
