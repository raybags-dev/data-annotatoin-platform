version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: annotation_platform
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - mongo
      - ollama
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  mongo_data:
  ollama_data:
